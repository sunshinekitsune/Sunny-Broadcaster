[package]
name = "Sunny-Broadcaster"
version = "0.1.0"
edition = "2024"

[dependencies.eframe]
version = "0.36.2"
default-features = false
features = ["default_fonts", "glow"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
